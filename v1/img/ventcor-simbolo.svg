<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Ventcor">
  <!-- Redibujo del símbolo de la sudadera (foto del 28-sep-2026): aire frío + aire caliente girando alrededor de un ventilador -->
  <defs>
    <linearGradient id="calor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F39AA0"/><stop offset="1" stop-color="#E8505F"/>
    </linearGradient>
    <linearGradient id="frio" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8CC3EE"/><stop offset="1" stop-color="#3F86D4"/>
    </linearGradient>
    <g id="estela" fill="none" stroke-linecap="round">
      <path d="M62 70 C104 40 168 30 192 58 C204 72 198 92 186 104" stroke-width="7"/>
      <path d="M148 30 C182 30 206 48 204 76 C203 86 199 94 194 100" stroke-width="5"/>
      <path d="M166 18 C200 22 220 44 216 72 C215 80 212 86 208 91" stroke-width="4"/>
    </g>
    <path id="aspa" d="M2 -10 C4 -28 22 -46 40 -38 C54 -31 46 -13 30 -7 C22 -4 13 -2 8 -1 Z"/>
  </defs>
  <use href="#estela" stroke="url(#calor)"/>
  <use href="#estela" stroke="url(#frio)" transform="rotate(180 120 100)"/>
  <g transform="translate(120 100) rotate(-8)" fill="#6CC04A">
    <use href="#aspa"/>
    <use href="#aspa" transform="rotate(90)"/>
    <use href="#aspa" transform="rotate(180)"/>
    <use href="#aspa" transform="rotate(270)"/>
    <circle r="11" fill="#1E1F1D"/>
    <circle r="7"/>
  </g>
</svg>
